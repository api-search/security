{%- comment -%}
  compare-css.html — styles for the /compare/ showcase (compare-*.html). Prefixed `cmp-` so they
  cannot repaint, or be repainted by, a host layout's own classes (same rule as api-mcp.html).
  Band colours are the same ladder as the provider page's .band-* pills.
{%- endcomment -%}
<style>
  .cmp-crumb { font-size: 0.8rem; color: #6c757d; margin: 0.25rem 0 0.75rem; }
  .cmp-crumb a { color: #6c757d; }
  .cmp-tool { display: inline-block; font-family: SFMono-Regular, Menlo, monospace; font-size: 0.75rem; background: #f1ecff; color: #5b21b6; border-radius: 999px; padding: 0.15em 0.7em; margin-bottom: 0.5rem; }
  .cmp-lead { font-size: 1.15rem; color: #3b4252; }
  .cmp-duel { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 1rem; align-items: center; background: #fff; border: 1px solid #e3e7ee; border-radius: 12px; padding: 1.25rem; margin: 1.25rem 0; }
  .cmp-side { text-align: center; min-width: 0; }
  .cmp-side h2 { font-size: 1.2rem; margin: 0.5rem 0 0.25rem; }
  .cmp-side h2 a { color: #1a1a2e; text-decoration: none; }
  .cmp-side h2 a:hover { text-decoration: underline; }
  .cmp-sun { display: inline-block; width: 120px; height: 120px; line-height: 0; }
  .cmp-sun svg { width: 100%; height: 100%; display: block; }
  .cmp-sun-sm { width: 56px; height: 56px; }
  .cmp-big { font-size: 1.9rem; font-weight: 700; color: #1a1a2e; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cmp-big span { font-size: 0.85rem; font-weight: 500; color: #8a94a6; }
  .cmp-sub { font-size: 0.8rem; color: #6c757d; margin-top: 0.25rem; }
  .cmp-vs { font-weight: 800; font-size: 1.1rem; color: #8a94a6; letter-spacing: 0.05em; }
  .cmp-win { display: inline-block; margin-top: 0.35rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #0f5132; background: #d1f7e0; border-radius: 999px; padding: 0.1em 0.6em; }
  .cmp-pill { display: inline-block; padding: 0.2em 0.7em; border-radius: 999px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .cmp-b-exemplar, .cmp-bar-exemplar { background: #d1f7e0; color: #0f5132; }
  .cmp-b-strong, .cmp-bar-strong { background: #cfe2ff; color: #0a3d91; }
  .cmp-b-developing, .cmp-bar-developing { background: #fff3cd; color: #664d03; }
  .cmp-b-thin, .cmp-bar-thin { background: #ffe0c2; color: #7a3e07; }
  .cmp-b-emerging, .cmp-bar-emerging { background: #f8d7da; color: #842029; }
  .cmp-b-minimal, .cmp-bar-minimal { background: #e9ecef; color: #495057; }
  .cmp-note { border-radius: 10px; padding: 0.9rem 1rem; margin: 1rem 0; font-size: 0.9rem; }
  .cmp-note-warn { background: #fff8e6; border: 1px solid #f3d27a; }
  .cmp-note-ok { background: #ecfbf2; border: 1px solid #9fdcb7; }
  .cmp-note strong { display: block; margin-bottom: 0.2rem; }
  .cmp-narr { font-size: 1rem; line-height: 1.65; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 0.5rem 0 1.5rem; }
  .cmp-table th, .cmp-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid #edf0f5; text-align: left; vertical-align: middle; }
  .cmp-table th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: #6c757d; font-weight: 700; }
  .cmp-table td.num, .cmp-table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cmp-table .lead-cell { font-weight: 700; color: #0f5132; }
  .cmp-pos { color: #0f5132; } .cmp-neg { color: #842029; }
  .cmp-meter { display: flex; align-items: center; gap: 0.4rem; justify-content: flex-end; }
  .cmp-meter i { display: block; height: 6px; border-radius: 3px; background: #3098d8; min-width: 2px; }
  .cmp-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cmp-bands { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 0.25rem 0 0.15rem; }
  .cmp-bands span { display: block; height: 100%; }
  .cmp-legend { font-size: 0.72rem; color: #6c757d; display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; }
  .cmp-legend b { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px; vertical-align: -1px; margin-right: 0.2rem; }
  .cmp-yes { color: #198754; font-weight: 700; } .cmp-no { color: #c0c6d0; }
  .cmp-share { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
  .cmp-share a, .cmp-share button { font-size: 0.78rem; font-weight: 600; border: 1px solid #d7dce5; border-radius: 6px; background: #fff; color: #4a5568; padding: 0.35rem 0.7rem; text-decoration: none; cursor: pointer; }
  .cmp-share a:hover, .cmp-share button:hover { border-color: #0d6efd; color: #0d6efd; }
  .cmp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1rem; margin: 1rem 0 2rem; }
  .cmp-card { display: block; background: #fff; border: 1px solid #e3e7ee; border-radius: 12px; padding: 1rem; color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
  .cmp-card:hover { border-color: #3098d8; box-shadow: 0 4px 16px rgba(48,152,216,.12); color: inherit; }
  .cmp-card-suns { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 0.6rem; }
  .cmp-card-suns .cmp-score { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
  .cmp-card-suns .cmp-vs { font-size: 0.8rem; }
  .cmp-card h3 { font-size: 1rem; margin: 0 0 0.35rem; color: #1a1a2e; }
  .cmp-card p { font-size: 0.82rem; color: #6c757d; margin: 0; }
  .cmp-call { background: #fff; border: 1px solid #e3e7ee; border-left: 3px solid #6d28d9; border-radius: 10px; padding: 1rem 1.1rem; margin: 2rem 0 0.5rem; }
  .cmp-call h2 { font-size: 1.15rem; margin: 0 0 0.35rem; }
  .cmp-call p { font-size: 0.88rem; color: #4a5568; }
  .cmp-call pre { background: #f6f8fa; border: 1px solid #e3e7ee; border-radius: 6px; padding: 0.6rem; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; margin: 0.4rem 0 0.75rem; }
  .cmp-call .cmp-cta { display: inline-block; background: #6d28d9; color: #fff; font-weight: 600; font-size: 0.85rem; border-radius: 6px; padding: 0.45rem 0.9rem; text-decoration: none; margin-right: 0.5rem; }
  .cmp-call .cmp-cta:hover { background: #5b21b6; }
  .cmp-raw summary { cursor: pointer; font-weight: 600; color: #0d6efd; font-size: 0.85rem; }
  .cmp-raw pre { max-height: 28rem; overflow: auto; background: #f6f8fa; border: 1px solid #e3e7ee; border-radius: 6px; padding: 0.6rem; font-size: 0.72rem; }
  @media (max-width: 575.98px) {
    .cmp-duel { grid-template-columns: 1fr; padding: 1rem; }
    .cmp-vs { padding: 0.25rem 0; }
    .cmp-sun { width: 96px; height: 96px; }
  }
</style>
